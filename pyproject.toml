[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-ai"
version = "0.1.0"
description = "RPG AI platform — SDLC operating system and tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "PyJWT[crypto]>=2.8",
    "jsonschema>=4.21",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
]

[project.optional-dependencies]
agent = [
    "deepagents>=0.1",
    "langchain-openai>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
pdf = ["pymupdf>=1.24"]

[tool.setuptools.packages.find]
where = ["app/backend/src"]

[tool.pytest.ini_options]
testpaths = ["app"]
asyncio_mode = "auto"
pythonpath = ["app/backend/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042", "UP017"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
