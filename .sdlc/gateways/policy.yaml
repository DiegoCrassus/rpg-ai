version: "1.0"
description: Deterministic pre/post interaction gateways for SDLC agent harness.

valid_agents:
  - intent-analyst
  - planner
  - architect
  - implementer
  - qa
  - auto-fixer
  - reviewer
  - devops
  - doctor
  - none

agent_order:
  intent-analyst:
    next: planner
    fallback: intent-analyst
  planner:
    next: architect
    fallback: intent-analyst
  architect:
    next: implementer
    fallback: planner
  implementer:
    next: qa
    fallback: architect
  qa:
    next: reviewer
    fallback: implementer
    failure_next: auto-fixer
  auto-fixer:
    next: qa
    fallback: implementer
  reviewer:
    next: devops
    fallback: implementer
  devops:
    next: none
    fallback: reviewer

handoff:
  required_sections:
    - Routing
    - Session
    - Scope
    - Blockers
  required_fields:
    Routing:
      - Next agent
      - Stage complete
      - Previous agent
    Session:
      - Card
      - Branch
      - Stage
  complete_values:
    - "yes"
    - "no"
  empty_values:
    - ""
    - "-"
    - "—"
    - "none"
    - "(none)"

pre_gateway:
  deny_shell_patterns:
    - "git\\s+reset\\s+--hard"
    - "git\\s+push\\s+--force"
    - "rm\\s+-rf\\s+/"
    - "mkdir\\s+(-p\\s+)?specs\\b"
    - "touch\\s+specs/"
  deny_message: "Deterministic SDLC gateway blocked an unsafe or bypassing shell command."

# Orchestrator must spawn Task(next_agent) — no inline implement/review/deploy.
orchestrator_delegation:
  pipeline_agents:
    - intent-analyst
    - planner
    - architect
    - implementer
    - qa
    - auto-fixer
    - reviewer
    - devops
  delegated_prefixes:
    - app/
    - .sdlc/
    - .cursor/
    - .github/
    - Makefile
    - AGENTS.md
    - docs/
    - pyproject.toml
    - data/
  orchestrator_allowlist:
    - .sdlc/memory/operational-context.md
  orchestrator_shell_allow_patterns:
    - "^git\\s+(status|log|diff|branch|show)\\b"
    - "python(3)?\\s+\\.sdlc/dsl/cli\\.py\\s+workflow\\b"
    - "python(3)?\\s+\\.sdlc/scripts/(token_budget_status|plane_state|plane_card|workflow_)\\b"
    - "make\\s+(token-budget-status|sdlc-doctor)\\b"
    - "^gh\\s+(auth|pr\\s+view|pr\\s+checks|run\\s+view)\\b"
  shell_agent_patterns:
    implementer:
      - "\\bgit\\s+add\\b"
      - "\\bgit\\s+commit\\b"
    devops:
      - "\\bgit\\s+push\\b"
      - "\\bgh\\s+pr\\s+(create|merge|close|ready)\\b"
      - "\\bgh\\s+pr\\s+review\\b"
    qa:
      - "\\bpytest\\b"
      - "\\bruff\\s+check\\b"
      - "\\bnpm\\s+(test|run\\s+build|run\\s+lint)\\b"
      - "python(3)?\\s+-m\\s+pytest\\b"
      - "make\\s+(test|lint|sdlc-doctor)\\b"
      - "python(3)?\\s+\\.sdlc/scripts/qa_evidence\\.py\\b"

post_gateway:
  reroute_on_missing_handoff: true
  reroute_on_incomplete_stage: true
  reroute_on_blockers: true
  verify_handoff_evidence: true
  max_autofix_cycles: 2

# Studio S4 propose-only mutations (RPG-84). Reference for gateway-check simulation;
# hooks do not parse this block today — studio_service reads it + gate.py.
studio_proposals:
  authority_badge: proposed_non_authoritative
  mandatory_dry_run_steps:
    - validate
    - doctor
    - gateway-check
  allowed_target_prefixes:
    - .sdlc/workflows/
    - .sdlc/stages/
    - .sdlc/pipeline/
    - .sdlc/manifest/
    - .sdlc/gates/
    - .cursor/agents/
    - .cursor/rules/
    - .cursor/skills/
    - .cursor/commands/
  forbidden_target_prefixes:
    - .sdlc/memory/
    - .sdlc/templates/plane/
    - .cursor/hooks/
    - .cursor/mcp.json
    - app/
    - specs/
  forbidden_api_patterns:
    - "POST /studio/proposals/{id}/apply"
    - "git commit"
    - "git push"
    - "gh pr merge"
  gate_check_module: .sdlc/dsl/gate.py
  gate_check_function: check_write
