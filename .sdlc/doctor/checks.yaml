    - .cursor/agents/intent-analyst.md
    - .cursor/skills/subagent-delegation/SKILL.md
    - .cursor/skills/intent-classification/SKILL.md
    - .cursor/skills/board-task-creation/SKILL.md
    - .cursor/skills/qa-minimum-checklist/SKILL.md
    - .cursor/skills/repository-sdlc/SKILL.md
  integrations:
    severity: warning
    items:
    - role: repository
      env_logical: repository_token
    - role: board
      env_logical: board_api_key
    - role: llm
      env_logical: llm_api_key
  makefile:
    severity: required
    targets:
    - sdlc-doctor
    - sdlc-validate
    - sdlc-stages
    - docs-check
    - workflow-status
    - workflow-discover
    - studio-dev
    - studio-api
    - studio-smoke
    - studio-e2e
  studio:
    severity: required
    import_app: studio_service.main
  python_dsl:
    severity: required
    importable: .sdlc/dsl/cli.py
