    severity: required
    items:
    - docs/README.md
    - docs/architecture/overview.md
    - docs/architecture/decisions.md
    - docs/architecture/system-context.md
    - docs/infrastructure/overview.md
    - docs/infrastructure/local-development.md
    - docs/infrastructure/deployment.md
    - docs/handoff/template.md
    - docs/handoff/current-state.md
    - docs/roadmap/roadmap.md
    - docs/operations/observability.md
    - docs/operations/incident-response.md
    - docs/operations/maintenance.md
    - docs/studio-service-operator-guide.md
    - docs/architecture/studio-service-platform.md
  yaml_validity:
    severity: required
    files:
    - .sdlc/sdlc.yaml
    - .sdlc/manifest/catalog.yaml
    - .sdlc/stages/lifecycle.yaml
    - .sdlc/stages/definitions.yaml
    - .sdlc/gates/paths.yaml
    - .sdlc/gateways/policy.yaml
    - .sdlc/workboard/granularity.yaml
    - .sdlc/pipeline/agents.yaml
    - .sdlc/workflows/transitions.yaml
    - .sdlc/rules/governance.yaml
    - .sdlc/integrations/services.yaml
    - .sdlc/doctor/checks.yaml
  content_markers:
    severity: required
    items:
    - path: .sdlc/README.md
      contains:
      - "## Module map"
      - "## Runtime artifacts"
    - path: .sdlc/process/README.md
      contains:
      - "## Purpose"
      - "## When to read"
    - path: .sdlc/memory/README.md
      contains:
      - "## Handoff format (Markdown"
      - "Do not"
    - path: .sdlc/gateways/README.md
      contains:
      - "## Purpose"
      - "## Gateway flow"
    - path: .sdlc/scripts/README.md
      contains:
      - "## Purpose"
      - "## When to read"
    - path: .sdlc/templates/README.md
      contains:
      - "## Purpose"
      - "## When to read"
    - path: .sdlc/templates/plane/README.md
      contains:
      - "## Purpose"
      - "## When to use"
    - path: .sdlc/templates/planner/README.md
      contains:
      - "## Purpose"
      - "## When to use"
    - path: app/studio-backend/README.md
      contains:
      - "studio-dev"
      - "/studio"
    - path: app/studio-frontend/README.md
      contains:
      - "studio-frontend"
      - "5174"
    - path: studio/README.md
      contains:
      - "Studio Service"
      - ".sdlc/"
    - path: docs/studio-service-operator-guide.md
      contains:
      - "studio-dev"
      - "STUDIO_AUTH_TOKEN"
  forbidden_content:
    severity: required
    items:
    - path: .sdlc/memory/orchestrator-handoff.md
      not_contains:
      - "```yaml"
  workflow_files:
    severity: required
    items:
    - AGENTS.md
    - .sdlc/sdlc.yaml
    - .sdlc/README.md
    - .sdlc/process/master-workflow.md
    - .sdlc/process/change-lifecycle.md
    - .sdlc/gates/paths.yaml
