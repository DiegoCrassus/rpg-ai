    - .sdlc/workboard/granularity.yaml
    - .sdlc/scripts/sdlc_gate.py
    - .sdlc/scripts/discovery_hook.py
    - .sdlc/dsl/gate.py
    - .sdlc/dsl/workflow.py
    - .sdlc/dsl/plane_granularity.py
    - .cursor/hooks.json
    - .cursor/hooks/sdlc_gate_hook.py
    - .cursor/hooks/sdlc_gateway_lib.py
    - .cursor/hooks/sdlc_pre_gateway.py
    - .cursor/hooks/sdlc_post_gateway.py
