# SDLC index (v5.2) — vendor-free
# 1. Read `core` below (IDE, VCS, workboard, env, paths)
# 2. Open module README: .sdlc/README.md → contract.modules.<name>.readme
# 3. Module data YAML paths in contract.modules.<name>.data

version: '5.2'
name: rpg-ai
description: AI-Native SDLC operating system for RPG — modular index.

contract:
  version: '5.2'
  schema: sdlc-manifest/v2-modular
  vendor_free: true
  layers:
    L0:
      path: AGENTS.md
      role: decision-tree
    L1:
      paths:
        - .sdlc/process/master-workflow.md
        - .sdlc/process/change-lifecycle.md
      role: process-authority
    L2:
      path: .sdlc/sdlc.yaml
      sections:
        - core
        - contract.modules
      role: machine-index
    governance:
      path: core.paths.rules
      role: prose-rules
  toolchain:
    loader: .sdlc/dsl/loader.py
    gate: .sdlc/dsl/gate.py
    workboard: .sdlc/dsl/board_granularity.py
    doctor: .sdlc/dsl/doctor.py
  rules_ref:
    - .cursor/rules/orchestrator.mdc
    - .cursor/rules/020-code-quality.mdc
    - .cursor/rules/030-docs-and-handoff.mdc
    - .cursor/rules/040-doctor-gates.mdc
    - .cursor/rules/sdlc-core.mdc
  index: .sdlc/README.md
  modules:
    manifest:
      readme: manifest/README.md
      data: manifest/catalog.yaml
    stages:
      readme: stages/README.md
      data: stages/lifecycle.yaml
    gates:
      readme: gates/README.md
      data: gates/paths.yaml
    gateways:
      readme: gateways/README.md
      data: gateways/policy.yaml
    workboard:
      readme: workboard/README.md
      data: workboard/granularity.yaml
    pipeline:
      readme: pipeline/README.md
      data: pipeline/agents.yaml
    workflows:
      readme: workflows/README.md
      data: workflows/transitions.yaml
    rules:
      readme: rules/README.md
      data: rules/governance.yaml
    integrations:
      readme: integrations/README.md
      data: integrations/services.yaml
    doctor:
      readme: doctor/README.md
      data: doctor/checks.yaml
    scripts:
      readme: scripts/README.md
    templates:
      readme: templates/README.md
    process:
      readme: process/README.md
      data:
        - process/master-workflow.md
        - process/change-lifecycle.md
        - process/lifecycle-model.yaml
        - process/intent_rules.yaml

core:
  schema: sdlc-core/v1
  vendor_free: true
  project:
    name: rpg-ai
    repository_slug: rpg-ai
    default_branch: develop
    sdlc_version: '5.2'
  vendors:
    ide:
      provider: cursor
      root: .cursor
      agents: agents
      skills: skills
      rules: rules
      commands: commands
      hooks: hooks
      mcp_config: .cursor/mcp.json
    repository:
      provider: github
      host: github.com
      owner: DiegoCrassus
      repository: rpg-ai
      default_branch: develop
    board:
      provider: plane
      card_prefix: RPG
      workspace: rpg
      project_slug: RPG
      project_id: aa9d95f3-0554-469c-92fa-9302cfef117f
    llm:
      provider: openai
  env:
    repository_token: GITHUB_PERSONAL_ACCESS_TOKEN_CLASSIC
    board_api_key: PLANE_API_KEY
    llm_api_key: OPENAI_API_KEY
    # Deprecated aliases — still resolved by board_client / repository scripts
    vcs_token: GITHUB_PERSONAL_ACCESS_TOKEN_CLASSIC
    workboard_api_key: PLANE_API_KEY
  paths:
    agents_entry: AGENTS.md
    sdlc_index: .sdlc/sdlc.yaml
    sdlc_readme: .sdlc/README.md
    memory: .sdlc/memory
    sdlc_process: .sdlc/process
    sdlc_gateways: .sdlc/gateways
    rules: .cursor/rules
    app: app
  conventions:
    feature_branch: feature/{card}-{slug}
    epic_tag: '[AI][EPIC]'
  gates:
    # strict — protected paths require open gate + matching stage (default).
    # 'off' — skip all write-gate checks (structural repo work, greenfield pivot).
    #         Must be quoted — bare `off` is parsed as YAML false. Re-enable strict when done.
    enforcement: off
  tokens:
    enforce: strict
    session_budget: 500000
    turn_budget: 32000
    subagent_budget: 120000
    handoff_max_lines: 45
    warn_ratio: 0.85
    estimate_chars_per_token: 4
    block_task_on_exceed: true
    block_prompt_on_exceed: true
  governance_refs:
    - .sdlc/process/master-workflow.md
    - .sdlc/process/change-lifecycle.md
